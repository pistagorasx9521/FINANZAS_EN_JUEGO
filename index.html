<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas en juego</title>
<style>
:root{--bg:#f6f8fc;--card:#ffffff;--ink:#14213d;--muted:#5b6478;--line:#d8deea;--navy:#1f3864;--gold:#c9a227;--ok:#1b7f4b;--bad:#c0392b;--b1:#1f3864;--b2:#8a6d0b;--b3:#3d6b6b;--shadow:0 6px 24px rgba(20,33,61,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a5a;--navy:#8fb0f0;--gold:#e5c04a;--ok:#4cc38a;--bad:#ff7b6b;--b1:#3a5fa8;--b2:#a98410;--b3:#2f7c7c;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--muted:#a9b3c9;--line:#2c3a5a;--navy:#8fb0f0;--gold:#e5c04a;--ok:#4cc38a;--bad:#ff7b6b;--b1:#3a5fa8;--b2:#a98410;--b3:#2f7c7c;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.4}
#app{max-width:560px;margin:0 auto;padding:52px 16px 16px}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
h1{font-size:26px;margin:8px 0 4px;color:var(--navy)}
p.sub{color:var(--muted);margin:0 0 16px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.hud small{color:var(--muted);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .1s linear}
.bar i.low{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px 18px;text-align:center;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:10px;animation:pop .3s ease}
.card .em{font-size:40px}
.card .q{font-size:20px;font-weight:650}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.row button,.btn{border:0;border-radius:14px;color:#fff;font-weight:700;font-size:15px;cursor:pointer;padding:14px 6px;min-height:64px;font-family:inherit}
.row button span{display:block;font-size:22px}
.row button:disabled{opacity:.45;cursor:default}
.b1{background:var(--b1)}.b2{background:var(--b2)}.b3{background:var(--b3)}
.btn{background:var(--navy);color:var(--bg);width:100%;margin-top:12px;min-height:50px}
.btn.alt{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.fb{margin-top:14px;padding:12px 14px;border-left:6px solid var(--line);background:var(--card);border-radius:10px;animation:pop .3s ease}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad);animation:shake .35s}
.fb b{display:block;margin-bottom:2px}
.modes{display:grid;gap:10px}
.mode{display:block;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-family:inherit;font-size:16px;width:100%}
.mode b{color:var(--navy)}.mode small{display:block;color:var(--muted)}
.big{font-size:54px;font-weight:800;color:var(--navy);text-align:center;margin:6px 0}
.rank{text-align:center;font-size:20px;font-weight:700}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:16px}
@keyframes pop{0%{transform:scale(.96);opacity:.5}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="mt" class="mute" aria-label="Activar o silenciar sonido">🔊</button>
<main id="app"></main>
<script>
var DECKS = {
  roles: { title: "¿Contador o Especialista?", sub: "Reparte las tareas entre el contador público y el especialista en Finanzas.",
    opts: [["c","Contador","📒","b1"],["e","Especialista","📈","b2"],["a","Ambos","🤝","b3"]],
    cards: [
      ["🧾","Registrar en el libro de compras una factura recibida","c","Registrar y cumplir las obligaciones tributarias es responsabilidad contable."],
      ["📈","Calcular el VAN de una máquina nueva de S/ 500 000","e","Evaluar inversiones con VAN y TIR es trabajo típico del especialista en Finanzas."],
      ["✍️","Firmar los estados financieros de la empresa","c","La firma y la responsabilidad legal sobre los estados financieros recaen en el contador público colegiado."],
      ["⚖️","Decidir cuánta deuda tomar: ¿100 % o 70 % del proyecto?","e","Definir la estructura de capital y la cobertura de la deuda es una decisión financiera."],
      ["🗓️","Cierre del mes: explicar por qué caja y resultados difieren del presupuesto","a","El contador asegura el registro correcto y el especialista interpreta las variaciones: trabajan juntos."],
      ["💱","Elegir si conviene cubrir con un forward un pago de US$ 100 000","e","Cubrir o no el riesgo cambiario es una decisión de gestión financiera."],
      ["📑","Documentar la cobertura cambiaria para que califique en los estados financieros","a","Finanzas diseña la cobertura y contabilidad la documenta y registra bajo las NIIF."],
      ["🏛️","Preparar la declaración mensual de impuestos","c","La contabilidad tributaria corresponde al contador."],
      ["🔮","Proyectar el flujo de caja de los próximos 12 meses","e","Proyectar es mirar hacia el futuro, función central de las finanzas."],
      ["🖥️","Depreciar un equipo de cómputo según la NIC 16","c","El reconocimiento y la medición bajo las normas contables son tarea contable."],
      ["🧮","Estimar las pérdidas crediticias esperadas (NIIF 9)","a","Exige un modelo financiero y un registro contable coherente."],
      ["🔒","Diseñar controles internos para caja y pagos","a","El control interno se construye entre contabilidad, finanzas y auditoría."]
    ] },
  sector: { title: "Público o privado", sub: "¿A quién corresponde cada situación: entidad pública, empresa privada o a ambos?",
    opts: [["u","Público","🏛️","b1"],["p","Privado","🏢","b2"],["a","Ambos","🤝","b3"]],
    cards: [
      ["🧱","Seguir las etapas compromiso, devengado y pago del gasto","u","El ciclo del gasto público se rige por los sistemas de Presupuesto y Tesorería."],
      ["📊","Aplicar NIIF completas por superar las 2 300 UIT de ingresos anuales","p","Ese umbral define el marco contable de las empresas privadas."],
      ["🎯","Medir el éxito por la ejecución del presupuesto y la calidad del servicio","u","En lo público importan la eficiencia y los resultados para la ciudadanía."],
      ["📣","Emitir bonos o acciones en el mercado de valores","p","El financiamiento en mercados de capitales es propio de las empresas privadas."],
      ["💧","Calcular razones de liquidez","a","La liquidez importa tanto para pagar proveedores públicos como privados."],
      ["🏦","Usar la Cuenta Única del Tesoro Público","u","Es el esquema de tesorería del Estado (D. Leg. 1441)."],
      ["🏗️","Evaluar un proyecto de inversión con VAN o costo-beneficio","a","Ambos sectores evalúan inversiones; cambian los criterios, no la necesidad de analizar."],
      ["🔍","Rendir cuentas ante el control gubernamental","u","El Sistema Nacional de Control fiscaliza el uso de los recursos públicos."],
      ["💎","Maximizar el valor para los accionistas","p","Crear valor es el objetivo central de la gestión financiera privada."],
      ["📚","Necesitar información contable confiable para decidir","a","Sin información confiable, ninguna decisión es buena."],
      ["🚦","Hacer solo lo que la ley expresamente permite","u","El principio de legalidad rige la actuación pública."],
      ["🗂️","Llevar los registros con el Plan Contable General Empresarial","p","El PCGE es el plan de cuentas de las empresas privadas."]
    ] }
};
var TIME = 12000, ROUNDS = 10;
var app = document.getElementById("app");
var S = {}, timer = null;

var AC = null, muted = false;
try { muted = localStorage.getItem("ff-mute") === "1"; } catch (e) {}
function tone(f, t0, dur, type, vol) {
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
function sfx(kind) {
  if (muted) return;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { return; }
  if (kind === "ok") { tone(660, 0, 0.12, "triangle"); tone(880, 0.1, 0.2, "triangle"); }
  else if (kind === "bad") { tone(220, 0, 0.18, "sawtooth", 0.12); tone(165, 0.15, 0.3, "sawtooth", 0.12); }
  else if (kind === "win") { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.13, 0.22, "triangle"); }); tone(1047, 0.55, 0.5, "triangle"); }
  else if (kind === "lose") { [392, 330, 262, 196].forEach(function (f, i) { tone(f, i * 0.2, 0.3, "square", 0.08); }); }
}
function best(mode) { try { return parseInt(localStorage.getItem("ff-best-" + mode), 10) || 0; } catch (e) { return 0; } }
function saveBest(mode, v) { try { if (v > best(mode)) localStorage.setItem("ff-best-" + mode, String(v)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function hearts(n) { var s = ""; for (var i = 0; i < 3; i++) s += i < n ? "❤️" : "🖤"; return s; }

function home() {
  clearInterval(timer);
  var h = "<h1>📊 Finanzas en juego</h1><p class=\"sub\">Clasifica cada situación antes de que se acabe el tiempo. Tienes 3 vidas: si fallas, pierdes una. Las rachas dan puntos extra.</p><div class=\"modes\">";
  Object.keys(DECKS).forEach(function (k) {
    h += "<button class=\"mode\" data-mode=\"" + k + "\"><b>" + DECKS[k].title + "</b><small>" + DECKS[k].sub + " · Récord: " + best(k) + "</small></button>";
  });
  h += "</div><p class=\"note\">Basado en la investigación «El especialista en Finanzas y su rol en la aplicación y gestión de la Contabilidad en empresas públicas y privadas».</p>";
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-mode]"), function (b) { b.onclick = function () { start(b.getAttribute("data-mode")); }; });
}

function start(mode) {
  sfx("init");
  S = { mode: mode, cards: shuffle(DECKS[mode].cards).slice(0, ROUNDS), i: 0, score: 0, streak: 0, lives: 3, locked: false, left: TIME };
  round();
}

function round() {
  var d = DECKS[S.mode], c = S.cards[S.i];
  S.locked = false; S.left = TIME;
  var h = "<div class=\"hud\"><span>⭐ <span id=\"sc\">" + S.score + "</span></span><small>Pregunta " + (S.i + 1) + " de " + S.cards.length + " · Racha " + S.streak + "</small><span>" + hearts(S.lives) + "</span></div>";
  h += "<div class=\"bar\"><i id=\"tb\"></i></div>";
  h += "<div class=\"card\"><div class=\"em\">" + c[0] + "</div><div class=\"q\">" + c[1] + "</div></div><div class=\"row\">";
  d.opts.forEach(function (o, n) { h += "<button class=\"" + o[3] + "\" data-k=\"" + o[0] + "\"><span>" + o[2] + "</span>" + o[1] + " <small>(" + (n + 1) + ")</small></button>"; });
  h += "</div><div id=\"fb\"></div>";
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-k]"), function (b) { b.onclick = function () { answer(b.getAttribute("data-k")); }; });
  var tb = document.getElementById("tb");
  clearInterval(timer);
  timer = setInterval(function () {
    S.left -= 100;
    var p = Math.max(0, S.left / TIME * 100);
    tb.style.width = p + "%";
    if (p < 30) tb.className = "low";
    if (S.left <= 0) answer(null);
  }, 100);
}

function answer(k) {
  if (S.locked) return;
  S.locked = true; clearInterval(timer);
  var d = DECKS[S.mode], c = S.cards[S.i], ok = k === c[2], pts = 0;
  var right = ""; d.opts.forEach(function (o) { if (o[0] === c[2]) right = o[1]; });
  if (ok) { pts = 100 + Math.round(S.left / TIME * 50) + Math.min(S.streak, 5) * 10; S.streak++; S.score += pts; }
  else { S.lives--; S.streak = 0; }
  sfx(ok ? "ok" : "bad");
  Array.prototype.forEach.call(app.querySelectorAll("[data-k]"), function (b) { b.disabled = true; });
  var last = S.lives === 0 || S.i === S.cards.length - 1;
  var head = ok ? "✅ ¡Correcto! +" + pts + " puntos" : (k === null ? "⏰ Se acabó el tiempo. " : "❌ No exactamente. ") + "La respuesta era «" + right + "»";
  document.getElementById("fb").innerHTML = "<div class=\"fb " + (ok ? "ok" : "bad") + "\"><b>" + head + "</b>" + c[3] + "</div><button class=\"btn\" id=\"nx\">" + (last ? "Ver resultado" : "Siguiente →") + "</button>";
  document.getElementById("sc").textContent = S.score;
  document.getElementById("nx").onclick = function () { if (last) finish(); else { S.i++; round(); } };
  document.getElementById("nx").focus();
}

function finish() {
  saveBest(S.mode, S.score);
  sfx(S.lives === 0 ? "lose" : "win");
  var r = S.score < 600 ? "🌱 Aprendiz de Finanzas" : S.score < 1100 ? "🔎 Analista financiero" : S.score < 1600 ? "📈 Especialista en Finanzas" : "👑 Director financiero (CFO)";
  var msg = S.lives === 0 ? "Te quedaste sin vidas: ¡repasa y vuelve a intentarlo!" : "Completaste todas las preguntas.";
  app.innerHTML = "<h1>Resultado</h1><div class=\"big\">" + S.score + "</div><div class=\"rank\">" + r + "</div><p class=\"sub\" style=\"text-align:center;margin-top:8px\">" + msg + " Récord en este modo: " + best(S.mode) + "</p><button class=\"btn\" id=\"again\">Jugar otra vez</button><button class=\"btn alt\" id=\"menu\">Elegir otro modo</button>";
  document.getElementById("again").onclick = function () { start(S.mode); };
  document.getElementById("menu").onclick = home;
}

document.addEventListener("keydown", function (e) {
  if (!S.cards || S.locked) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 3 && document.getElementById("fb") && !document.getElementById("nx")) answer(DECKS[S.mode].opts[n - 1][0]);
});
var mt = document.getElementById("mt");
function paintMute() { mt.textContent = muted ? "🔇" : "🔊"; }
mt.onclick = function () { muted = !muted; try { localStorage.setItem("ff-mute", muted ? "1" : "0"); } catch (e) {} paintMute(); if (!muted) sfx("ok"); };
paintMute();
home();
</script>
</body>
</html>
